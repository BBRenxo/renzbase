<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RenzBase</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="app">
      <!-- Title bar -->
      <header class="titlebar">
        <div class="titlebar-left">
          <span class="brand">RenzBase</span>
          <span class="brand-sub">— executor</span>
        </div>
        <div class="titlebar-right">
          <span id="attach-status" class="status-pill status-detached">no client</span>
        </div>
      </header>

      <!-- Tabs row -->
      <nav class="tabs" id="tabs">
        <div class="tabs-list" id="tabs-list"></div>
        <div class="tabs-actions">
          <button class="tab-btn" id="tab-new" title="New tab">+</button>
        </div>
      </nav>

      <!-- Main 2-column area: sidebar | editor -->
      <main class="main">
        <aside class="sidebar">
          <div class="sidebar-header">
            <input
              id="script-filter"
              type="text"
              class="filter-input"
              placeholder="Filter scripts..."
              spellcheck="false"
              autocomplete="off"
            />
          </div>
          <div class="sidebar-section-header">
            <span>Scripts</span>
            <button id="new-script-btn" class="mini-btn" title="New script">+</button>
          </div>
          <div class="sidebar-tree" id="sidebar-tree"></div>
          <div class="sidebar-footer">
            <span class="hint">Place scripts in</span>
            <code>%APPDATA%\RenzBase\scripts</code>
          </div>
        </aside>

        <section class="editor-pane">
          <div id="monaco-host" class="monaco-host"></div>
          <div class="editor-toolbar">
            <button id="attach-btn" class="primary-btn">Attach</button>
            <button id="execute-btn" class="primary-btn accent">Execute</button>
            <button id="save-btn" class="secondary-btn">Save</button>
            <span class="grow"></span>
            <span id="active-tab-name" class="active-tab-name"></span>
          </div>
        </section>
      </main>

      <!-- Console panel -->
      <section class="console" id="console-panel">
        <div class="console-header">
          <span>Console</span>
          <button id="console-clear" class="mini-btn">clear</button>
        </div>
        <div class="console-body" id="console-body"></div>
      </section>

      <!-- Status bar -->
      <footer class="statusbar">
        <span id="status-text">ready</span>
        <span class="grow"></span>
        <span id="status-right"></span>
      </footer>
    </div>

    <!-- Monaco loader -->
    <script>
      // Configure AMD loader BEFORE Monaco loads.
      window.MonacoEnvironment = {
        getWorkerUrl: function (moduleId, label) {
          const baseUrl = 'https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/vs';
          return (
            'data:text/javascript;charset=utf-8,' +
            encodeURIComponent(
              `self.MonacoEnvironment = { baseUrl: '${baseUrl}/' };` +
              `importScripts('${baseUrl}/base/worker/workerMain.js');`
            )
          );
        },
      };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/vs/loader.js"></script>
    <script src="main.js"></script>
  </body>
</html>
